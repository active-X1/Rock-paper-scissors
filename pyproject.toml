[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rps-arena"
dynamic = ["version"]
description = "A modern Rock, Paper, Scissors game with a NiceGUI web interface and a terminal mode."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cyrus Akacha Cyprian" }]
keywords = ["rock-paper-scissors", "game", "nicegui", "python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Games/Entertainment",
]
dependencies = ["nicegui>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rps-arena = "rps_arena.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rps_arena.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rps_arena = ["assets/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
